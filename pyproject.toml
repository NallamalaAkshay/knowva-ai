[project]
name = "knowva-ai-backend"
version = "0.1.0"
description = "Source-grounded company knowledge chatbot API"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1.0,<2.0",
  "fastapi>=0.115,<1.0",
  "openai>=1.60,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "pypdf>=5.1,<7.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

